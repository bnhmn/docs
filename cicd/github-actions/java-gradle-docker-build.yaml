name: Build Java app with Gradle and containerize

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      push_image:
        type: boolean
        description: Push Docker image
        default: true

concurrency:
  # Cancel any ongoing jobs when a new job is triggered for the branch
  group: "${{ github.workflow }}/${{ github.ref_name }}/build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      docker_registry: docker.io
      docker_image_name: my-docker-namespace/my-repo-name
      push_image: ${{github.event.inputs.push_image}}

    steps:
      # https://github.com/actions/checkout
      - name: git checkout
        uses: actions/checkout@v7

      # https://github.com/actions/setup-java
      - name: java setup
        uses: actions/setup-java@v7
        with:
          java-version: 25
          distribution: temurin

      # Configure Gradle for optimal use in GiHub Actions, including caching of downloaded dependencies.
      # https://github.com/gradle/actions
      - name: gradle setup
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: gradle build
        run: ./gradlew build test bootJar

      # Set up BuildKit Docker container builder to be able to build multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: docker buildx setup
        uses: docker/setup-buildx-action@v4
        if: env.push_image == 'true'

      # Login against the Docker registry
      # https://github.com/docker/login-action
      - name: docker login
        uses: docker/login-action@v4
        with:
          registry: ${{env.docker_registry}}
          username: ${{secrets.docker_username}}
          password: ${{secrets.docker_password}}
        if: env.push_image == 'true'

      # Extract Git ref metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: docker extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{env.docker_registry}}/${{env.docker_image_name}}
        if: env.push_image == 'true'

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: docker build and push
        id: build-and-push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{env.docker_image_name}}:latest
          labels: ${{steps.meta.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: env.push_image == 'true'
