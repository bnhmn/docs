# https://docs.cloud.google.com/build/docs/build-config-file-schema
$schema: https://www.schemastore.org/cloudbuild.json

substitutions:
  # This pipeline is intended for monorepos with independently buildable Java modules. Each module has
  # its own subdirectory and cloudbuild.yaml file. Configure a Cloud Build trigger with a path filter
  # so that a module pipeline runs only when files in that module change:
  #
  # repository/
  # ├── module-a/
  # │   └── cloudbuild.yaml
  # └── module-b/
  #     └── cloudbuild.yaml
  #
  # For a single-module repository, just remove all $_MODULE_NAME references from the steps below.
  _MODULE_NAME: my-java-app
  # A GCS bucket is used to cache Maven dependencies. Dependency caching is a best practice in CI and
  # can save several minutes per build, depending on the number of dependencies.
  _GCS_CACHE_BUCKET: my-gcs-cache-bucket-name
  # To share files between build steps, we must store them in the /workspace folder. By default only root can write
  # there. If one of your steps runs a container using a non-root user, permissions may need to be adjusted.
  # https://docs.cloud.google.com/build/docs/configuring-builds/pass-data-between-steps
  _MAVEN_CACHE_FILE: /workspace/maven-cache.tgz
  _MAVEN_LOCAL_REPO: /workspace/.m2/repository
  _SONAR_HOST_URL: https://sonar.example.com
  _SONAR_PROJECT_KEY: my-sonar-project-key
  _AR_HOST: europe-west3-docker.pkg.dev
  _AR_REPOSITORY: my-docker-repository
  _CLOUD_RUN_REGION: europe-west3

availableSecrets:
  secretManager:
    - { env: NEXUS_USERNAME, versionName: projects/$PROJECT_ID/secrets/cloudbuild-nexus-username/versions/latest }
    - { env: NEXUS_PASSWORD, versionName: projects/$PROJECT_ID/secrets/cloudbuild-nexus-password/versions/latest }
    - { env: BITBUCKET_TOKEN, versionName: projects/$PROJECT_ID/secrets/cloudbuild-bitbucket-token/versions/latest }
    - { env: SONAR_TOKEN, versionName: projects/$PROJECT_ID/secrets/cloudbuild-sonarqube-token/versions/latest }

steps:
  - id: docker-compose-up
    name: gcr.io/cloud-builders/docker
    dir: $_MODULE_NAME
    env:
      - CI=true
    script: docker compose up -d

  - id: maven-cache-restore
    name: gcr.io/cloud-builders/gcloud
    dir: $_MODULE_NAME
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      # This maintains a global cache per repository. It is invalidated every month to prevent infinite cache growth.
      year_month="$(date -u +%Y-%m)"
      pom_hash="$(find . -name pom.xml -type f -print0 | sort -z | xargs -0 cat | sha256sum | awk '{print $1}')"
      cache_file="gs://$_GCS_CACHE_BUCKET/$REPO_NAME/maven/$year_month/$pom_hash.tgz"
      cache_dir="gs://$_GCS_CACHE_BUCKET/$REPO_NAME/maven/$year_month/"

      restore_cache() {
        gcloud storage cp "$1" "$_MAVEN_CACHE_FILE"
        mkdir -p "$_MAVEN_LOCAL_REPO"
        tar -xzf "$_MAVEN_CACHE_FILE" -C "$_MAVEN_LOCAL_REPO"
      }

      if gcloud storage ls "$cache_file" >/dev/null 2>&1; then
        echo "INFO: Exact cache found, restoring from '$cache_file'"
        restore_cache "$cache_file"
      elif latest_cache="$(gcloud storage ls -l "$cache_dir" 2>/dev/null | grep '\.tgz' | sort -k2 | tail -n1 | awk '{print $NF}')"; then
        echo "INFO: Found fallback cache, restoring from '$latest_cache'"
        restore_cache "$latest_cache"
      else
        echo "INFO: No cache available in '$cache_dir', starting cold"
      fi

  - id: maven-test
    name: maven:3.9-eclipse-temurin-25-alpine
    dir: $_MODULE_NAME
    secretEnv:
      - NEXUS_USERNAME
      - NEXUS_PASSWORD
    script: mvn verify --batch-mode --settings settings.xml -Dmaven.repo.local="$_MAVEN_LOCAL_REPO"

  - id: sonar-fetch-history
    name: gcr.io/cloud-builders/git
    dir: $_MODULE_NAME
    secretEnv:
      - BITBUCKET_TOKEN
    script: |
      #!/usr/bin/env bash
      set -eo pipefail
      args=(
        -c http.extraHeader="Authorization: Bearer $BITBUCKET_TOKEN"
        -c http.sslCAInfo="/path/to/my-custom-root-ca.pem"
      )
      # https://docs.cloud.google.com/build/docs/automating-builds/create-manage-triggers#include_the_repository_history_in_a_build
      git "${args[@]}" fetch --unshallow
      # https://docs.cloud.google.com/build/docs/configuring-builds/substitute-variable-values
      if [ -n "$_BASE_BRANCH" ]; then
        git "${args[@]}" fetch origin "$_BASE_BRANCH"
      fi

  - id: sonar-code-analysis
    name: sonarsource/sonar-scanner-cli:12.1
    dir: $_MODULE_NAME
    secretEnv:
      - SONAR_TOKEN
    script: |
      #!/usr/bin/env bash
      set -eo pipefail
      # https://docs.sonarsource.com/sonarqube-server/10.7/analyzing-source-code/analysis-parameters
      args=(
        -Dsonar.working.directory="/tmp/.sonar"
        -Dsonar.host.url="$_SONAR_HOST_URL"
        -Dsonar.projectKey="$_SONAR_PROJECT_KEY"
        -Dsonar.projectBaseDir="/workspace/$_MODULE_NAME"
        -Dsonar.sources="/workspace/$_MODULE_NAME/src/main"
        -Dsonar.tests="/workspace/$_MODULE_NAME/src/test"
        -Dsonar.java.binaries="/workspace/$_MODULE_NAME/target/classes"
        -Dsonar.java.test.binaries="/workspace/$_MODULE_NAME/target/test-classes"
        -Dsonar.junit.reportPaths="/workspace/$_MODULE_NAME/target/surefire-reports"
        -Dsonar.coverage.jacoco.xmlReportPaths="/workspace/$_MODULE_NAME/target/site/jacoco*/jacoco.xml"
        -Dsonar.qualitygate.wait=true
      )
      if [ -n "$_BASE_BRANCH" ]; then
        echo "INFO: Pull request build detected"
        args+=(
          -Dsonar.pullrequest.key="$_PR_NUMBER"
          -Dsonar.pullrequest.branch="$_HEAD_BRANCH"
          -Dsonar.pullrequest.base="$_BASE_BRANCH"
        )
      else
        echo "INFO: Branch build detected"
        args+=(-Dsonar.branch.name="$REF_NAME")
      fi
      sonar-scanner "${args[@]}"

  - id: docker-build
    waitFor: [maven-test]
    name: gcr.io/cloud-builders/docker
    dir: $_MODULE_NAME
    script: docker build -t "$_MODULE_NAME:$SHORT_SHA" . --build-context maven_repo="$_MAVEN_LOCAL_REPO"

  - id: docker-push
    waitFor: [maven-test, docker-build, sonar-code-analysis]
    name: gcr.io/cloud-builders/docker
    dir: $_MODULE_NAME
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      if [[ ! "$TRIGGER_NAME" =~ -(master|tag)$ ]]; then
        echo "INFO: Skipping docker push: build was not triggered by master branch or tag"
        exit 0
      fi
      local_image="$_MODULE_NAME:$SHORT_SHA"
      ar_image="$_AR_HOST/$PROJECT_ID/$_AR_REPOSITORY/$_MODULE_NAME:$SHORT_SHA"
      docker tag "$local_image" "$ar_image" && docker push "$ar_image"
      echo "$ar_image" > /workspace/ar-image

  - id: cloud-run-deploy
    name: gcr.io/cloud-builders/gcloud
    dir: $_MODULE_NAME
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      if [[ ! "$TRIGGER_NAME" =~ -(master|tag)$ ]]; then
        echo "INFO: Skipping deployment: build was not triggered by master branch or tag"
        exit 0
      fi
      gcloud run services update "$_MODULE_NAME" --image="$(< /workspace/ar-image)" --region="$_CLOUD_RUN_REGION"

  - id: maven-cache-save
    name: gcr.io/cloud-builders/gcloud
    dir: $_MODULE_NAME
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      # This maintains a global cache per repository. It is invalidated every month to prevent infinite cache growth.
      year_month="$(date -u +%Y-%m)"
      pom_hash="$(find . -name pom.xml -type f -print0 | sort -z | xargs -0 cat | sha256sum | awk '{print $1}')"
      cache_file="gs://$_GCS_CACHE_BUCKET/$REPO_NAME/maven/$year_month/$pom_hash.tgz"

      if gcloud storage ls "$cache_file" >/dev/null 2>&1; then
        echo "INFO: Skipping cache save: cache already exists at '$cache_file'"
      else
        tar -czf "$_MAVEN_CACHE_FILE" -C "$_MAVEN_LOCAL_REPO" .
        gcloud storage cp "$_MAVEN_CACHE_FILE" "$cache_file"
        echo "INFO: Maven cache saved to '$cache_file'"
      fi

options:
  machineType: E2_HIGHCPU_8
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  dynamicSubstitutions: true
  automapSubstitutions: true
  substitutionOption: ALLOW_LOOSE
