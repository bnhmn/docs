# This configuration is intended for the cloud environment (dev/staging/prod)

app:
  backend:
    base-url: ${BACKEND_BASE_URL}

logging:
  # Enable structured logging in cloud mode
  structured:
    format:
      console: logstash

server:
  # https://docs.spring.io/spring-boot/how-to/webserver.html#howto.webserver.use-behind-a-proxy-server
  forward-headers-strategy: native

spring:
  cloud:
    # Refresh scope is not supported with native images
    # https://docs.spring.io/spring-cloud-config/reference/server/aot-and-native-image-support.html
    refresh:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # If possible, secrets should be loaded directly from a secret manager, like HashiCorp Vault, instead of env vars
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
  security:
    oauth2:
      client:
        # This is the identity provider configuration for the OIDC login.
        # The name for registration/provider can be chosen freely (e.g., auth0, okta, azure, keycloak, etc.).
        registration:
          idp:
            client-id: ${IDP_CLIENT_ID}
            client-secret: ${IDP_CLIENT_SECRET}
            scope: [ openid, profile, email, offline_access ]
        provider:
          idp:
            issuer-uri: https://my-idp.example.com/auth/v2
  web:
    resources:
      static-locations:
      - classpath:/public/
