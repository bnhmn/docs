# This configuration is intended to be active when a developer starts the application locally

app:
  backend:
    base-url: http://example.com/api

logging:
  level:
    com.example.webapp: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE

spring:
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
  docker:
    compose:
      enabled: true
      file: ../compose.yaml
      lifecycle-management: start_only
  security:
    oauth2:
      client:
        # This is the identity provider configuration for the OIDC login.
        # The name for registration/provider can be chosen freely (e.g., auth0, okta, azure, keycloak, etc.).
        registration:
          idp:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: [openid, profile, email, offline_access]
        provider:
          idp:
            # We are testing the login against the oidc-mock defined in docker-compose.yaml.
            issuer-uri: http://localhost:3000/default
  web:
    resources:
      static-locations:
        - file:../frontend/public/
        - file:../frontend/dist/
        - classpath:/public/
